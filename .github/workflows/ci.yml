name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-syntax:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4

      - name: Compile every .lua (loadfile)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(**/*.lua)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有找到任何 .lua 文件"
            exit 1
          fi
          for f in "${files[@]}"; do
            LUA_FILE="$f" lua5.4 -e '
              local p = os.getenv("LUA_FILE")
              local fn, err = loadfile(p)
              if not fn then
                io.stderr:write("::error file=" .. p .. "::" .. tostring(err) .. "\n")
                os.exit(1)
              end
              print("ok: " .. p)
            '
          done

  smoke:
    name: Smoke test (mock GG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lupa
        run: |
          python -m pip install --upgrade pip
          python -m pip install lupa

      - name: Run tests/smoke_test.py
        run: python tests/smoke_test.py
